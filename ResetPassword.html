<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - StreamVerse</title>
    <link rel="stylesheet" href="LoginPage.css">
</head>
<body>

    <div class="login-card">
        <h2>Reset Credentials</h2>
        <div id="statusMsg" class="status-msg"></div>

        <form action="NewPassword" method="POST">
            <div class="form-group">
                <label for="pass1">New Password</label>
                <input type="password" id="pass1" name="pass1" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group">
                <label for="pass2">Confirm New Password</label>
                <input type="password" id="pass2" name="pass2" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="submit-btn">Update Password</button>
        </form>

        <div class="links">
            <a href="LoginPage.html">Cancel & Back to Sign In</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const err = params.get('error');
        const box = document.getElementById('statusMsg');
        if (err) {
            box.style.display = 'block';
            box.className = 'status-msg error';
            if (err === 'password_mismatch') {
                box.innerText = 'Provided passwords do not match.';
            } else if (err === 'update_failed') {
                box.innerText = 'System update failed. Please submit again.';
            } else {
                box.innerText = 'An error occurred during password update.';
            }
        }
    </script>
</body>
</html>
